# Prova una tantum: legge i metadati pubblici di accesso (OAuth) del connettore La Scatola /mcp
# e li salva in probe/. Nessuna credenziale, nessun dato degli ospiti.
name: Prova accesso La Scatola
on:
  push:
    paths: [".github/workflows/scatola-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Metadati OAuth
        run: |
          set +e
          B=https://databox-ffvb3.ondigitalocean.app
          mkdir -p probe
          get() { echo "### $1"; curl -sS -m 20 -D - "$1"; echo; echo; }
          {
            echo "### POST /mcp senza credenziali"
            curl -sS -m 20 -D - -X POST "$B/mcp" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"probe","version":"0"}}}' | head -c 3000
            echo; echo
            get "$B/.well-known/oauth-protected-resource/mcp"
            get "$B/.well-known/oauth-protected-resource"
            get "$B/.well-known/oauth-protected-resource/api/v1"
            get "$B/.well-known/oauth-authorization-server"
            get "$B/.well-known/oauth-authorization-server/mcp"
            get "$B/.well-known/openid-configuration"
          } > probe/oauth.txt 2>&1
          AS=$(curl -sS -m 20 "$B/.well-known/oauth-protected-resource/mcp" | jq -r '.authorization_servers[0] // empty')
          if [ -z "$AS" ]; then AS=$(curl -sS -m 20 "$B/.well-known/oauth-protected-resource" | jq -r '.authorization_servers[0] // empty'); fi
          echo "authorization server: $AS" > probe/as.txt
          if [ -n "$AS" ]; then
            ORIGIN=$(echo "$AS" | sed -E 's#(https?://[^/]+).*#\1#'); PATHPART=$(echo "$AS" | sed -E 's#https?://[^/]+##')
            { get "$ORIGIN/.well-known/oauth-authorization-server$PATHPART"; get "$AS/.well-known/oauth-authorization-server"; get "$AS/.well-known/openid-configuration"; } >> probe/as.txt 2>&1
          fi
          true
      - name: Salva il risultato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Prova accesso La Scatola: metadati" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
